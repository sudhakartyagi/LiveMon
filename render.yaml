services:
  - type: web
    name: classroom-agent-api
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classroom-agent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: classroom-agent-db
    databaseName: copilot
    plan: free
    ipAllowList: []
