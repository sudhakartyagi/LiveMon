[project]
name = "classroom-copilot-v5"
version = "6.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyjwt>=2.8",
  "pytest>=8.0",
  "httpx>=0.27",
  "pgvector>=0.2.5",
  "openai>=1.10",
  "streamlit>=1.31",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
